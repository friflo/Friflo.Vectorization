name: Generators-CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install Mesa and OS Dependencies
      # Install software driver MESA for WebGPU
      run: |
        sudo apt-get update
        sudo apt-get install -y \
        libvulkan1 \
        mesa-vulkan-drivers \
        libx11-6 \
        libx11-xcb1 \
        libxcb-dri3-0 \
        libwayland-client0

    - name: Restore dependencies
      working-directory: ./
      run: dotnet restore -r linux-x64

    - name: Build
      working-directory: ./
      # Wir bauen alle Projekte direkt, das ignoriert die Solution-Einschränkung
      run: |
        for proj in $(find . -name "*.csproj"); do
          echo "Building $proj for linux-x64..."
          dotnet build "$proj" -r linux-x64 --no-restore -p:CopyLocalLockFileAssemblies=true
        done

    - name: Debug LDD
      run: |
        # Suche die libwgpu_native.so im Build-Ordner
        LIB_PATH=$(find . -name "libwgpu_native.so" | head -n 1)
        if [ -z "$LIB_PATH" ]; then
          echo "❌ libwgpu_native.so NICHT GEFUNDEN!"
        else
          echo "✅ Gefunden in: $LIB_PATH"
          ldd $LIB_PATH  # Zeigt fehlende System-Abhängigkeiten an
        fi
      working-directory: ./

    - name: Test
      env:
        # Enable finding software driver MESA required by WebGPU
        VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      working-directory: ./
      # Auch hier: Direkt auf das Test-Projekt zielen
      run: |
        dotnet test src/Tests-Generators/Tests-Generators-Code.csproj -r linux-x64 --no-build --verbosity normal
        dotnet test src/Tests-Generators-Verify/Tests-Generators-Verify.csproj --no-build --verbosity normal



    