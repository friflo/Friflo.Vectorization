<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TmGui - WebGPU</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #666666; // #1e1e1e;
            overflow: hidden;
        }
        #gpu-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            /* touch-action: none; ensures direct pointer handling without touch gesture synthesis */
        }
        /* info message overlay styling */
        #info-overlay {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ffffff;
            color: #0000df;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 16px 16px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            text-align: center;
            white-space: pre-line;
            flex-direction: column; /* stack elements vertically */
            align-items: center;
        }
    </style>
</head>
<body>
    <canvas id="gpu-canvas"></canvas>
    
    <!-- Error overlay element shown when app is not found -->
    <div style="display:flex;" id="info-overlay">TmGui loading ...</div>

    <!-- Load the renderer script as a module -->
    <script type="module" src="app.js"></script>
</body>
</html>
