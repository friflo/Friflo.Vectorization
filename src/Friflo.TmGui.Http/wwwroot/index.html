<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TmGui - WebGPU</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            overflow: hidden;
        }
        #gpu-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            /* touch-action: none; ensures direct pointer handling without touch gesture synthesis */
        }
    </style>
</head>
<body>
    <canvas id="gpu-canvas"></canvas>

    <!-- Load the renderer script as a module -->
    <script type="module" src="app.js"></script>
</body>
</html>
