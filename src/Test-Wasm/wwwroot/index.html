<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <title>Test-Wasm</title>
</head>
<body>
    <h1>Test-Wasm JIT/AOT</h1>
    <p id="output">Wait for .NET...</p>

    <script type="module">
        import { dotnet }                   from './_framework/dotnet.js';
        import { initializeSmGuiWebRTC }    from './webrtc-interop.js';
    
        // Initialize .NET WebAssembly Runtime
        const runtime = await dotnet
                .withDiagnosticTracing(false)
                .create();

        await initializeSmGuiWebRTC(runtime);

        // Example: access exported C#-methods
        const assemblyName = "Test-Wasm.dll";
        const exports = await runtime.getAssemblyExports(assemblyName);
        
        const result = exports.Program.ProcessData("Hello from Browser!");
        
        document.getElementById("output").innerText = result;
        console.log(result);
        
        await exports.Program.Start();
        
        </script>
        <link rel="modulepreload" href="webrtc-interop.js">
    </body>
</html>
