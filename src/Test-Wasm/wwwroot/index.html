<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <title>Test-Wasm</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
    <style>
        :root {
            color-scheme: light dark;
            --bg:   #ffffff;
            --text: #1f2328;
            --link: #0969da;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg:   #0d1117;
                --text: #e6edf3;
                --link: #58a6ff;
            }
        }
        body { font-family: Arial, Helvetica, "Liberation Sans", sans-serif;
               background: var(--bg); color: var(--text); }
        a    { text-decoration: none; color: var(--link); }
    </style>
    <!-- <link rel="manifest" href="manifest.webmanifest"> --> <!-- uncomment to run as PWA -->
</head>
<body>
    <h1>Test-Wasm IL/AOT</h1>
    <p id="state">.NET starting ...</p>    
    <a id="webrtc-client" target="_blank">WebRTC client</a>

    <script type="module">
        if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
            navigator.serviceWorker.register('./service-worker.js').catch(console.error);
        }

        import { dotnet }                   from './_framework/dotnet.js';
        import { initializeSmGuiWebRTC }    from './webrtc-interop.js';
        
        // Create .NET WebAssembly Runtime
        const runtime = await dotnet.create();

        await initializeSmGuiWebRTC(runtime);
        
        // --- Run C# WASM App
        function onAppStarted(appId) {
          document.getElementById("webrtc-client").href = `https://localhost:8081/?app=${appId}`;
          document.getElementById("state").innerText    = "app started";
        }
        Object.defineProperty(globalThis, "onAppStarted", { set: onAppStarted, configurable: true });
        
        await runtime.runMain();
    </script>
    <link rel="modulepreload" href="webrtc-interop.js">
</body>
</html>
